name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5   # Pages must be enabled once by hand: Settings -> Pages -> Source: GitHub Actions

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .            # the pages are plain HTML at the repository root

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
